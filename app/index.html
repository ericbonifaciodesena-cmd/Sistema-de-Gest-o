<!doctype html>
<!-- publicado via GitHub Pages -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comissões &amp; Rotina</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="login-wrap" class="login-wrap">
    <form id="login-form" class="login-card">
      <img src="logo-sena.png" alt="Sena Seguros" class="login-logo">
      <p class="mark">Comissões &amp; Rotina</p>
      <p class="tag">controle interno · login da equipe</p>
      <div class="field">
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Entrar</button>
      <p class="login-error" id="login-error"></p>
      <p class="tag" style="margin-top:14px;">
        <a href="#" id="forgot-link" style="color:var(--accent);">Esqueci minha senha</a>
      </p>
    </form>
  </div>

  <div id="app-wrap" class="app" hidden>
    <div class="topbar">
      <div class="brand">
        <img src="logo-sena.png" alt="Sena Seguros" class="brand-logo">
        <span class="mark">Comissões &amp; Rotina</span>
        <span class="tag">controle interno</span>
      </div>
      <div class="who">
        <span class="name" id="who-name"></span>
        <button id="logout-btn">Sair</button>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" id="tab-comissoes" role="tab" aria-selected="true">Comissões</button>
      <button class="tab" id="tab-tarefas" role="tab" aria-selected="false">Tarefas</button>
      <button class="tab" id="tab-cobrancas" role="tab" aria-selected="false">Cobranças</button>
    </div>

    <div class="panel active" id="panel-comissoes">
      <div class="toolbar">
        <span class="hint" id="comissoes-hint">Carregando…</span>
        <button class="btn ghost" id="add-vendor-btn">+ vendedor</button>
      </div>
      <div class="vendor-grid" id="vendor-grid"></div>
    </div>

    <div class="panel" id="panel-tarefas">
      <div class="history-toggle">
        <button class="btn ghost small" id="history-btn">Ver histórico</button>
      </div>
      <div id="board">
        <div class="week-grid" id="week-grid"></div>
      </div>
      <div id="historico">
        <table class="history">
          <thead><tr><th>Data</th><th>Dia</th><th>Tarefa</th><th>Responsável</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>

    <div class="panel" id="panel-cobrancas">
      <div class="cb-stats">
        <div class="cb-stat cb-stat-bad">
          <div class="cb-stat-value tabular" id="cb-stat-atrasados-n">0</div>
          <div class="cb-stat-sub tabular" id="cb-stat-atrasados-v">R$ 0,00</div>
          <div class="cb-stat-label">Atrasados</div>
        </div>
        <div class="cb-stat">
          <div class="cb-stat-value tabular" id="cb-stat-hoje-n">0</div>
          <div class="cb-stat-sub tabular" id="cb-stat-hoje-v">R$ 0,00</div>
          <div class="cb-stat-label">Hoje</div>
        </div>
        <div class="cb-stat cb-stat-accent">
          <div class="cb-stat-value tabular" id="cb-stat-total">R$ 0,00</div>
          <div class="cb-stat-label">Total a receber</div>
        </div>
      </div>

      <div id="cb-fila"></div>

      <div class="cb-new-wrap">
        <button class="btn ghost" id="cb-add-toggle">+ novo cliente</button>
        <div class="cb-new-form" id="cb-new-form" hidden>
          <input id="cb-nome" class="cb-input" placeholder="Nome do cliente">
          <div class="cb-forma-row">
            <button type="button" class="chip cb-forma-chip is-on" data-forma="Boleto">Boleto</button>
            <button type="button" class="chip cb-forma-chip" data-forma="Pix">Pix</button>
          </div>
          <label class="cb-label">Valor da parcela</label>
          <input id="cb-valor" class="cb-input" type="number" step="0.01">
          <label class="cb-label">Data da primeira cobrança</label>
          <input id="cb-data" class="cb-input" type="date">
          <label class="cb-label">Número de parcelas</label>
          <input id="cb-parcelas" class="cb-input" type="number" value="12">
          <div class="cb-new-actions">
            <button class="btn small" id="cb-add-confirm">Adicionar cliente</button>
            <button class="btn ghost small" id="cb-add-cancel">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="cb-modal-overlay" class="cb-modal-overlay" hidden>
    <div class="cb-modal" id="cb-modal">
      <div class="cb-modal-head">
        <div>
          <h2 id="cb-modal-nome"></h2>
          <p class="tag" id="cb-modal-forma"></p>
        </div>
        <button class="icon-btn" id="cb-modal-close">✕</button>
      </div>
      <div id="cb-modal-parcelas"></div>
      <label class="cb-label" style="margin-top:14px;">Observações</label>
      <textarea id="cb-modal-obs" class="cb-input" rows="3" placeholder="Anotações sobre este cliente..."></textarea>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
