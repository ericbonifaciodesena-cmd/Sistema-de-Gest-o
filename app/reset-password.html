<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova senha — Comissões & Rotina</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-wrap">
    <form id="reset-form" class="login-card">
      <img src="logo-sena.png" alt="Sena Seguros" class="login-logo">
      <p class="mark">Nova senha</p>
      <p class="tag">Comissões &amp; Rotina · controle interno</p>
      <div class="field">
        <label for="new-password">Nova senha</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="field">
        <label for="confirm-password">Confirmar senha</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="btn">Salvar nova senha</button>
      <p class="login-error" id="reset-error"></p>
      <p class="login-error" id="reset-ok" style="color: var(--good);"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    (function () {
      var supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      var form = document.getElementById("reset-form");
      var errorEl = document.getElementById("reset-error");
      var okEl = document.getElementById("reset-ok");

      supabase.auth.onAuthStateChange(function (event) {
        if (event !== "PASSWORD_RECOVERY") return;
      });

      form.addEventListener("submit", async function (ev) {
        ev.preventDefault();
        errorEl.textContent = "";
        okEl.textContent = "";
        var pass = document.getElementById("new-password").value;
        var confirm = document.getElementById("confirm-password").value;
        if (pass !== confirm) {
          errorEl.textContent = "As senhas não coincidem.";
          return;
        }
        var res = await supabase.auth.updateUser({ password: pass });
        if (res.error) {
          errorEl.textContent = "Não foi possível salvar: " + res.error.message;
          return;
        }
        okEl.textContent = "Senha alterada! Redirecionando…";
        setTimeout(function () { window.location.href = "index.html"; }, 1500);
      });
    })();
  </script>
</body>
</html>
